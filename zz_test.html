<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="Race through 22 world cities in a free browser racing game: dodge traffic, chain near misses, fire nitro and earn 3 stars in every city.">
<meta name="theme-color" content="#0b0b0d">
<title>Extreme Racer – World Tour Racing</title>
<link id="favicon" rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/garage.css">
</head>
<body>
<div id="loading" hidden><div class="logo">EXTREME<br>RACER</div><div class="bar"><div id="loadfill"></div></div><div id="loadtip">Loading...</div></div>
<div id="stage"><canvas id="gl"></canvas><canvas id="game" width="400" height="480" tabindex="0"></canvas></div>
<input id="songInput" type="file" accept="audio/*" multiple hidden>
<!-- The import map lets module code say: import ... from "three" (no build step, no CDN). -->
<script type="importmap">
{ "imports": { "three": "./lib/three/three.module.min.js", "three/addons/": "./lib/three/addons/" } }
</script>
<script>
  /* The game waits (on its title screen) while the 3D models load. If that stalls, or this browser cannot run the 3D code, give up and play in 2D instead. */
  if (location.protocol === "file:") console.info("Extreme Racer: opened as a plain file, so the 3D version is off. Use Live Server (or tools/serve.ps1) for 3D.");
  window.R3D_PENDING = !new URLSearchParams(location.search).has("2d") && true; window.R3D_BOOT = 0; /* (opened as a plain file: browsers block the 3D code, so play in 2D straight away) */ /* boot.js sets this to Date.now() each time it makes progress */
  if (window.R3D_PENDING) document.write("<style>#loading[hidden]{display:flex}</style>"); /* show the loading screen only when we will really load 3D */
  (function () { var t0 = Date.now(); setTimeout(function watch() {
    if (!window.R3D_PENDING) return;
    var now = Date.now();
    if (window.R3D_BOOT ? now - window.R3D_BOOT > 20000 : now - t0 > 12000) { window.R3D_PENDING = false; if (window.disable3D) window.disable3D("3D loading stalled"); var l = document.getElementById("loading"); if (l) l.remove(); }
    else setTimeout(watch, 1500);
  }, 1500); })();
</script>
<!-- The game code is split into plain script files that run in this order and share one scope. -->
<script src="js/data/config.js"></script>
<script src="js/data/helpers.js"></script>
<script src="js/data/teams.js"></script>

<script src="js/audio/music.js"></script>

<script src="js/sim/world.js"></script>
<script src="js/ui/menus.js"></script>
<script src="js/sim/stages.js"></script>
<script src="js/sim/effects.js"></script>
<script src="js/sim/gameplay.js"></script>
<script src="js/ui/devices.js"></script>
<script src="js/ui/controller.js"></script>
<script src="js/sim/update.js"></script>
<script src="js/render2d/tiles.js"></script>
<script src="js/render2d/cars.js"></script>
<script src="js/render2d/scenery.js"></script>

</body>
