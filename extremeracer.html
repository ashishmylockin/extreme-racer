<body>
<canvas id="game" width="400" height="480"></canvas>
<input id="songInput" type="file" accept="audio/*" multiple hidden>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 400, H = 480; // the width stretches to fit your screen; on a portrait phone the height grows instead
let ROAD_L = 40; const ROAD_W = 320; let ROAD_R = ROAD_L + ROAD_W; // grass verges either side of the road, always centred
const LANES = 3, LANE_W = ROAD_W / LANES, CAR_W = 36, CAR_H = 72;
const SPAWN_PX = 220;      // distance between traffic spawns at the start (shrinks as you progress)
const GRID_STEP = 55;      // frames between the five red start lights coming on (~0.9s each)
const AI_REACT = 6;        // the CPU pulls away exactly 6 frames = 0.100s after the lights turn green
const STAGE_LEN = 2400;    // distance travelled per city in Endless
const LEVEL_LEN = 20000;   // World Tour: one city is one level (~65s flat out at 300 km/h, ~90s driving carefully)
const VMAX = 5.5;          // CPU top speed (x60 = km/h); the player has no cap
const NITRO_MAX = VMAX * 1.3;  // where the speed dial needle tops out
const NITRO_PUSH = 2.2;        // how far above your normal speed nitro can push you (~130 km/h)
// throttle pull at speed v, per frame: ~40 km/h per second off the line, fading like air drag does
// (0-100 in ~2.6s, 0-300 in ~10.5s), but never below 4 km/h per second, so holding on always gains speed
const accelAt = v => Math.max(40 / (1 + (v * 60 / 250) ** 3), 4) / 3600;
const NITRO_FRAMES = 200;      // nitro burn time (~3.3s)
const AHEAD = 1000;        // how far up the road traffic, coins and scenery exist, so the 3D views see an endless road
const TAU = Math.PI * 2;

// ---------- helpers ----------

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

function shade(hex, amt) { // amt -1..1 (darken..lighten)
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = amt < 0 ? 0 : 255, t = Math.abs(amt);
  r = Math.round(r + (f - r) * t); g = Math.round(g + (f - g) * t); b = Math.round(b + (f - b) * t);
  return `rgb(${r},${g},${b})`;
}

// gears: 8 of them, each covering a slice of the speed range (shared by the gauge, the sound and the rev lights)
const effV = r => Math.max(r.v, (r.rev || 0) * 2.8); // what the engine sounds / the rev needle shows: revs count while you're on the grid
const gearOf = v => clamp(1 + Math.floor(v / 0.75), 1, 8);
function rpmOf(v) { const g = gearOf(v), lo = (g - 1) * 0.75; return clamp((v - lo) / 0.75, 0, 1); } // 8th redlines at 360 km/h, then sits on the limiter

const hx = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const PINE = [24, 86, 52];

// flags, drawn into a w x h box at the origin
const stripes = (cols, vertical, ratio) => (w, h) => {
  const tot = ratio ? ratio.reduce((a, b) => a + b, 0) : cols.length;
  let at = 0;
  cols.forEach((c, i) => {
    const f = (ratio ? ratio[i] : 1) / tot;
    ctx.fillStyle = c;
    if (vertical) ctx.fillRect(at * w, 0, f * w + 0.5, h); else ctx.fillRect(0, at * h, w, f * h + 0.5);
    at += f;
  });
};
const dot = (x, y, r, c) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); };
const crescent = (x, y, r, c, bg) => { dot(x, y, r, c); dot(x + r * 0.4, y, r * 0.8, bg); };
const FLAGS = {

    ctx.fillStyle = "#fff"; ctx.fillRect(0, h * 0.2, w * 0.5, h * 0.1); ctx.fillRect(w * 0.2, 0, w * 0.1, h * 0.5);

    for (const [x, y] of [[0.25, 0.8], [0.72, 0.2], [0.84, 0.5], [0.72, 0.8], [0.6, 0.5]]) dot(w * x, h * y, h * 0.06, "#fff");
  },
  cn: (w, h) => { ctx.fillStyle = "#de2910"; ctx.fillRect(0, 0, w, h); dot(w * 0.22, h * 0.3, h * 0.17, "#ffde00"); },
  jp: (w, h) => { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); dot(w / 2, h / 2, h * 0.3, "#bc002d"); },
  us: (w, h) => { stripes(["#b22234", "#fff", "#b22234", "#fff", "#b22234", "#fff", "#b22234"])(w, h); ctx.fillStyle = "#3c3b6e"; ctx.fillRect(0, 0, w * 0.45, h * 0.54); },
  ca: (w, h) => { stripes(["#d52b1e", "#fff", "#d52b1e"], true, [1, 2, 1])(w, h); dot(w / 2, h / 2, h * 0.2, "#d52b1e"); },
  mc: stripes(["#ce1126", "#fff"]),
  es: stripes(["#aa151b", "#f1bf00", "#aa151b"], false, [1, 2, 1]),
  at: stripes(["#ed2939", "#fff", "#ed2939"]),
  gb: (w, h) => {
    ctx.fillStyle = "#012169"; ctx.fillRect(0, 0, w, h);
    ctx.lineWidth = h * 0.2; ctx.strokeStyle = "#fff"; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(w, h); ctx.moveTo(w, 0); ctx.lineTo(0, h); ctx.stroke();
    ctx.lineWidth = h * 0.08; ctx.strokeStyle = "#c8102e"; ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.fillRect(w * 0.4, 0, w * 0.2, h); ctx.fillRect(0, h * 0.35, w, h * 0.3);

  be: stripes(["#111111", "#fae042", "#ed2939"], true),
  hu: stripes(["#ce2939", "#fff", "#477050"]),
  nl: stripes(["#ae1c28", "#fff", "#21468b"]),
  it: stripes(["#009246", "#fff", "#ce2b37"], true),
  az: (w, h) => { stripes(["#00b5e2", "#ef3340", "#509e2f"])(w, h); crescent(w * 0.45, h * 0.5, h * 0.15, "#fff", "#ef3340"); },
  sg: (w, h) => { stripes(["#ef3340", "#fff"])(w, h); crescent(w * 0.2, h * 0.25, h * 0.18, "#fff", "#ef3340"); },
  mx: (w, h) => { stripes(["#006847", "#fff", "#ce1126"], true)(w, h); dot(w / 2, h / 2, h * 0.12, "#8a5a2b"); },
  br: (w, h) => {
    ctx.fillStyle = "#009b3a"; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#fedf00"; ctx.beginPath(); ctx.moveTo(w * 0.5, h * 0.1); ctx.lineTo(w * 0.9, h * 0.5); ctx.lineTo(w * 0.5, h * 0.9); ctx.lineTo(w * 0.1, h * 0.5); ctx.closePath(); ctx.fill();
    dot(w / 2, h / 2, h * 0.23, "#002776");
  },
  qa: (w, h) => { ctx.fillStyle = "#8d1b3d"; ctx.fillRect(0, 0, w, h); ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(w * 0.3, 0); for (let i = 0; i < 5; i++) { ctx.lineTo(w * 0.38, h * (i + 0.5) / 5); ctx.lineTo(w * 0.3, h * (i + 1) / 5); } ctx.lineTo(0, h); ctx.closePath(); ctx.fill(); },
  ae: (w, h) => { stripes(["#00732f", "#fff", "#000"])(w, h); ctx.fillStyle = "#ff0000"; ctx.fillRect(0, 0, w * 0.25, h); },
};
function drawFlag(key, w, h) { FLAGS[key](w, h); ctx.strokeStyle = "rgba(0,0,0,0.35)"; ctx.lineWidth = 0.8; ctx.strokeRect(0, 0, w, h); }

// AI tuning: think = frames between decisions, look = how far ahead it sees (px),
// miss = chance it fails to notice a given car, cooldown = min frames between lane changes,
// greedy = detours for coins when the road is clear, speed = the pace it likes to hold

// ---------- saved progress ----------

// ---------- sound (synthesised, no assets) ----------

const sound = {
  on: store.get("sound", true), ac: null, out: null, eng: null, env: null, nit: null, noiseBuf: null,
  ensure() {
    if (!this.ac) {
      try {
        this.ac = new (window.AudioContext || window.webkitAudioContext)();
        this.out = this.ac.createGain();
        this.out.gain.value = 0.22; // master level for effects: kept low
        this.out.connect(this.ac.destination);
      } catch (e) { this.ac = null; }
    }
    if (this.ac && this.ac.state === "suspended") this.ac.resume();
    return this.ac;
  },
  noiseBuffer() {
    if (!this.noiseBuf) {
      const ac = this.ac, len = ac.sampleRate, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = buf;
    }
    return this.noiseBuf;
  },
  tone(f1, f2, dur, type = "square", vol = 0.06, delay = 0) {
    if (!this.on || !this.ensure()) return;
    const t = this.ac.currentTime + delay, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.out);
    o.start(t); o.stop(t + dur);
  },
  // filtered noise burst whose filter sweeps from f0 to f1: the building block for clicks, whooshes and pops
  burst(dur, vol, type, f0, f1, delay = 0) {
    if (!this.on || !this.ensure()) return;
    const t = this.ac.currentTime + delay, src = this.ac.createBufferSource(), f = this.ac.createBiquadFilter(), g = this.ac.createGain();
    src.buffer = this.noiseBuffer(); f.type = type; f.Q.value = 1.2;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.out);
    src.start(t, Math.random() * 0.5, dur + 0.02);
  },
  // paddle-shift: a crisp click and a blow-off "pssh" on the way up, a throttle blip and burble on the way down
  shift(up) {
    if (up) {
      this.burst(0.05, 0.6, "highpass", 3000, 3000);
      this.tone(210, 90, 0.07, "square", 0.05);
      this.burst(0.2, 0.32, "bandpass", 4200, 1400, 0.03);
    } else {
      this.tone(150, 340, 0.1, "sawtooth", 0.05);
      this.burst(0.05, 0.55, "highpass", 2600, 2600);
      for (let i = 0; i < 3; i++) this.burst(0.05, 0.5, "lowpass", 900, 250, 0.07 + i * 0.055);
    }
  },
  coin() { this.tone(900, 1500, 0.09, "square", 0.04); },
  jingle(i) { // a short rising motif, pitched a little differently for each country
    const base = [523, 587, 659, 698, 784][i % 5];
    [1, 1.25, 1.5, 2].forEach((m, k) => this.tone(base * m, base * m, 0.28, "triangle", 0.05, k * 0.11));
  },
  // engine: detuned saw + square plus a turbine whine; pitch climbs through each gear then drops on the shift
  engineTick(active, v, boost = false) {
    if (active && this.on && this.ac && this.ac.state === "running") {
      if (!this.eng) {
        const a = this.ac.createOscillator(), b = this.ac.createOscillator(), c = this.ac.createOscillator();
        const g = this.ac.createGain(), gc = this.ac.createGain(), f = this.ac.createBiquadFilter();
        a.type = "sawtooth"; b.type = "square"; c.type = "triangle"; f.type = "lowpass"; g.gain.value = 0.05; gc.gain.value = 0.25;
        a.connect(f); b.connect(f); c.connect(gc); gc.connect(f); f.connect(g); g.connect(this.out);
        a.start(); b.start(); c.start();
        this.eng = { a, b, c, f, g };
      }
      const gear = gearOf(v), hz = (92 + gear * 12 + rpmOf(v) * 150) * (boost ? 1.32 : 1), t = this.ac.currentTime;
      this.eng.a.frequency.setTargetAtTime(hz, t, 0.03);
      this.eng.b.frequency.setTargetAtTime(hz * 2.01, t, 0.03);
      this.eng.c.frequency.setTargetAtTime(hz * 4, t, boost ? 0.02 : 0.03);
      this.eng.f.frequency.setTargetAtTime(600 + rpmOf(v) * 1500 + gear * 120 + (boost ? 1600 : 0), t, 0.05);
      this.eng.g.gain.setTargetAtTime(boost ? 0.08 : 0.05, t, 0.1);
      this.nitroLayer(boost);
    } else {
      if (this.eng) this.silenceEngine();
      this.nitroLayer(false);
    }
  },
  // the roaring flame hiss that sits on top of the engine while nitro burns
  nitroLayer(on) {
    if (!this.ac || (!this.nit && !on)) return;
    if (!this.nit) {
      const ac = this.ac, src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = this.noiseBuffer(); src.loop = true; f.type = "bandpass"; f.frequency.value = 1600; f.Q.value = 0.6; g.gain.value = 0;
      src.connect(f); f.connect(g); g.connect(this.out); src.start();
      this.nit = { g, f };
    }
    const t = this.ac.currentTime;
    this.nit.g.gain.setTargetAtTime(on && this.on ? 0.5 : 0, t, on ? 0.05 : 0.12);
    if (on) this.nit.f.frequency.setTargetAtTime(1500 + Math.random() * 1400, t, 0.05);
  },
  nitroStart() { // whoosh, blow-off and a rising turbine scream
    this.burst(0.5, 0.7, "bandpass", 500, 6000);
    this.burst(0.18, 0.5, "highpass", 3500, 3500);
    this.tone(160, 1100, 0.6, "sawtooth", 0.07);
    this.tone(320, 1500, 0.5, "square", 0.03, 0.05);
  },
  nitroEnd() { // the flutter as it cuts out
    this.tone(900, 120, 0.35, "sawtooth", 0.05);
    for (let i = 0; i < 4; i++) this.burst(0.06, 0.45, "lowpass", 1200, 250, 0.05 + i * 0.07);
    this.burst(0.3, 0.3, "bandpass", 3500, 800, 0.1);
  },
  silenceEngine() {
    if (!this.eng) return;
    try { this.eng.g.gain.value = 0; this.eng.a.stop(); this.eng.b.stop(); this.eng.c.stop(); } catch (e) {}
    this.eng = null;
  },
  // everything cut dead the instant you crash
  silence() {
    this.silenceEngine();
    if (this.nit) this.nit.g.gain.value = 0;
    if (this.env) { this.env.rain.gain.cancelScheduledValues(0); this.env.wind.gain.cancelScheduledValues(0); this.env.rain.gain.value = 0; this.env.wind.gain.value = 0; }
  },
  whoosh() { this.burst(0.28, 0.22, "bandpass", 450, 2800); this.tone(300, 900, 0.18, "sine", 0.03); }, // a near miss rushing past
  thud() { this.burst(0.22, 0.5, "lowpass", 700, 120); this.tone(90, 35, 0.2, "sine", 0.18); },
  // ambience: rain hiss, wind and birdsong follow the weather
  envTick(active, rain, wind, birds) {
    if (!this.ac || this.ac.state !== "running") return;
    if (!this.env) {
      const ac = this.ac, buf = this.noiseBuffer();
      const mk = (type, freq, q) => {
        const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
        s.buffer = buf; s.loop = true; f.type = type; f.frequency.value = freq; f.Q.value = q; g.gain.value = 0;
        s.connect(f); f.connect(g); g.connect(this.out); s.start();
        return g;
      };
      this.env = { rain: mk("highpass", 2200, 0.7), wind: mk("bandpass", 420, 0.9) };
    }
    const on = this.on && active, t = this.ac.currentTime;
    this.env.rain.gain.setTargetAtTime(on ? rain * 0.05 : 0, t, 0.4);
    this.env.wind.gain.setTargetAtTime(on ? wind * 0.07 : 0, t, 0.4);
    if (on && birds > 0.05 && Math.random() < 0.012 * birds) {
      const f = rnd(2600, 3500);
      this.tone(f, f * 1.25, 0.07, "sine", 0.025);
      this.tone(f * 1.1, f * 1.4, 0.07, "sine", 0.025, 0.1);
    }
  },
  toggle() { this.on = !this.on; store.set("sound", this.on); if (this.on) this.tone(500, 800, 0.1); },
};

// ---------- menu music ----------
// Original synth tracks (no audio files shipped), plus any songs the player adds from their own device.

const SYNTH_TRACKS = [
  { name: "Redline", bpm: 128, bass: [0, 3, 6, 8, 11, 14], chords: [[57, 0, 3, 7], [53, 0, 4, 7], [60, 0, 4, 7], [55, 0, 4, 7]] },
  { name: "Pole Position", bpm: 120, bass: [0, 2, 4, 6, 8, 10, 12, 14], chords: [[52, 0, 3, 7], [48, 0, 4, 7], [55, 0, 4, 7], [50, 0, 4, 7]] },
  { name: "Midnight Apex", bpm: 108, bass: [0, 6, 8, 14], chords: [[50, 0, 3, 7], [46, 0, 4, 7], [53, 0, 4, 7], [48, 0, 4, 7]] },
  { name: "Chequered Flag", bpm: 136, bass: [0, 3, 6, 8, 10, 12, 15], chords: [[48, 0, 3, 7], [44, 0, 4, 7], [51, 0, 4, 7], [46, 0, 4, 7]] },
];
const ARP = [0, 1, 2, 3, 2, 1, 2, 1, 0, 1, 2, 3, 2, 1, 3, 2];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

const music = {
  on: store.get("music", true), tracks: SYNTH_TRACKS.map(t => ({ name: t.name, synth: t })), idx: -1, playing: false,
  bus: null, timer: null, step: 0, nextT: 0, audio: null, userCount: 0,
  get name() { return this.idx >= 0 ? this.tracks[this.idx].name : "-"; },
  addBlob(name, blob) {
    this.tracks.push({ name: name.replace(/\.[^.]+$/, ""), url: URL.createObjectURL(blob) });
    this.userCount++;
  },
  clearUser() { this.stop(); this.tracks = this.tracks.filter(t => t.synth); this.userCount = 0; this.idx = -1; },
  tick(should) {
    const want = should && sound.on && this.on;
    if (want && !this.playing && sound.ac && sound.ac.state === "running") this.start();
    else if (!want && this.playing) this.stop();
  },
  start() {
    if (this.idx < 0) { const u = this.tracks.findIndex(t => !t.synth); this.idx = u >= 0 ? u : Math.floor(Math.random() * SYNTH_TRACKS.length); }
    const tr = this.tracks[this.idx];
    this.playing = true;
    if (tr.synth) {
      const ac = sound.ac;
      this.bus = ac.createGain(); this.bus.gain.value = 0; this.bus.connect(ac.destination);
      this.bus.gain.setTargetAtTime(0.5, ac.currentTime, 0.15);
      this.step = 0; this.nextT = ac.currentTime + 0.1;
      this.timer = setInterval(() => this.schedule(tr.synth), 25);
    } else {
      this.audio = new Audio(tr.url); this.audio.volume = 0.6;
      this.audio.onended = () => { this.stop(); this.next(); };
      this.audio.play().catch(() => {});
    }
  },
  stop() {
    this.playing = false;
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    if (this.bus) { const b = this.bus; try { b.gain.setTargetAtTime(0, sound.ac.currentTime, 0.08); } catch (e) {} setTimeout(() => { try { b.disconnect(); } catch (e) {} }, 500); this.bus = null; }
    if (this.audio) { this.audio.onended = null; this.audio.pause(); this.audio = null; }
  },
  next() { const was = this.playing; this.stop(); this.idx = (this.idx + 1) % this.tracks.length; if (was) this.start(); },
  schedule(def) {
    const ac = sound.ac, spb = 60 / def.bpm / 4; // one sixteenth
    while (this.nextT < ac.currentTime + 0.12) { this.play(def, this.step, this.nextT, spb); this.nextT += spb; this.step++; }
  },
  voice(type, midi, t, dur, vol, cutoff) {
    const ac = sound.ac, o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
    o.type = type; o.frequency.value = mtof(midi); f.type = "lowpass"; f.frequency.value = cutoff;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(this.bus);
    o.start(t); o.stop(t + dur + 0.03);
  },
  noiseHit(t, dur, vol, type, freq) {
    const ac = sound.ac, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = sound.noiseBuffer(); f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.bus);
    s.start(t, Math.random() * 0.5, dur + 0.02);
  },
  play(def, step, t, spb) {
    const ac = sound.ac, s = step % 16, ch = def.chords[Math.floor(step / 16) % 4], root = ch[0], tones = ch.slice(1).map(x => root + x);
    if (s % 4 === 0) { // kick
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
      g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      o.connect(g); g.connect(this.bus); o.start(t); o.stop(t + 0.2);
    }
    if (s === 4 || s === 12) { this.noiseHit(t, 0.13, 0.32, "bandpass", 1900); this.voice("triangle", 55, t, 0.09, 0.2, 800); }
    this.noiseHit(t, 0.04, s % 2 === 0 ? (s % 4 === 2 ? 0.14 : 0.07) : 0.035, "highpass", 7500);
    if (def.bass.includes(s)) this.voice("sawtooth", root - 12, t, spb * 1.8, 0.3, 380);
    const a = ARP[s], note = a === 3 ? tones[0] + 12 : tones[a] + 12;
    this.voice("square", note, t, spb * 0.9, 0.05, 2400);
    if (s === 0) for (const n of tones) this.voice("sawtooth", n, t, spb * 15.5, 0.05, 700);
  },
};

const songDB = {
  open() {
    return new Promise((res, rej) => {
      try {
        const rq = indexedDB.open("cardodge-songs", 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore("songs", { keyPath: "id", autoIncrement: true });
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => rej(rq.error);
      } catch (e) { rej(e); }
    });
  },
  async run(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction("songs", mode), out = fn(tx.objectStore("songs"));
      tx.oncomplete = () => res(out && out.result);
      tx.onerror = () => rej(tx.error);
    });
  },
  all() { return this.run("readonly", s => s.getAll()); },
  add(name, blob) { return this.run("readwrite", s => s.add({ name, blob })); },
  clear() { return this.run("readwrite", s => s.clear()); },
};

const held = new Set();

const aiGo = () => grid.done && frame >= grid.goFrame + AI_REACT;
function laneX(lane) { return ROAD_L + lane * LANE_W + LANE_W / 2; }
function say(text) { toast = { text, t: 0 }; }
const runKm = () => ((dist - startDist) * 0.012).toFixed(1); // distance covered this run (not counting where you jumped in)
const view3D = () => (state === "playing" || state === "over" || state === "cleared" || state === "paused" || state === "camera") ? cam : 0;

// ---------- world setup ----------

function makeRacer(i, opts) {
  const lane = i === 0 ? 1 : 2, y = H - 100 + (i === 0 ? 0 : 44); // first car on pole in the middle, the second one row back
  return Object.assign({
    id: i, label: "", ai: null, team: TEAMS[0],
    lane, x: laneX(lane), y, ty: y, slot: { lane, off: i === 0 ? 0 : 44 },
    v: 0, rev: 0, launched: false, braking: false, tilt: 0, alive: true, score: 0, passed: 0, coins: 0, nitro: 0, rolling: false,
    fromLane: lane, lastMove: -99, nextThink: 0, drift: 0, deadT: 0,
  }, opts);
}

function initWorld() {
  enemies = []; pickups = []; particles = []; scenery = []; roadItems = []; wx = [];
  frame = 0; clock = 0; speed = 2; scroll = 2; scrollPos = 0; dist = 0; sceneAcc = 0; spawnAcc = 0; pickupAcc = 600;
  grid = newGrid(true); startObj = null; level = null; finishObj = null; starAnim = null; uiFx = [];
  shake = 0; sprayFog = 0; pops = []; slowT = 0; kickFx = 0; sprayCar = null; tier = 0; newBest = false; banner = null; lastStage = 0; wet = 0; lastGear = 0; result = ""; camOff = 0;
  updateStage();
  camRefY = H - 100; nitroFx = 0;
  for (let y = -AHEAD; y < H + 40; y += 55) spawnScenery(y);
}

function initDemo() {
  initWorld();
  racers = [10, 8, 9].map((t, i) => { const lane = [1, 0, 2][i], y = H - 100 - i * 90; return makeRacer(i, { team: TEAMS[t], ai: DEMO_AI, lane, x: laneX(lane), y, ty: y, v: 2.8, fromLane: lane, rolling: true }); });
  seedTraffic();
}

// the rival drives the top team (Aurora); if you're in Aurora or the similar purple Nightjar, it brings the hot pink Stratos
function rivalTeam() { return TEAMS[equipped === 10 || equipped === 1 ? 8 : 10]; }

// jump the world to the start of a given city (the World Tour map previews the selected city behind it)
function jumpTo(i, frac = 0) {
  dist = STAGE_LEN * (i + frac);
  updateStage();
  scenery = [];
  for (let y = -AHEAD; y < H + 40; y += 55) spawnScenery(y);
}

function startGame(m, d, stage = 0) {
  mode = m;
  if (d) difficulty = d;
  initWorld();
  runStage = stage;
  if (m === "tour") level = { idx: stage, d0: 0, len: LEVEL_LEN };
  if (stage) jumpTo(stage);
  startDist = dist;
  if (level) { level.d0 = dist; updateStage(); }
  lastStage = stageIdx;
  racers = [makeRacer(0, { label: m === "single" || m === "tour" ? "" : m === "vs" ? "YOU" : "P1", team: TEAMS[equipped] })];
  if (m === "vs") racers.push(makeRacer(1, { label: "CPU", team: rivalTeam(), ai: DIFFS[difficulty] }));
  if (m === "multi") racers.push(makeRacer(1, { label: "P2", team: rivalTeam() }));
  if (level && stage === ROUTE.length - 1) { // Grand Final: first to the line wins
    level.final = true; racers[0].label = "YOU";
    racers.push(makeRacer(1, { label: "CPU", team: rivalTeam(), ai: FINAL_CPU }));
  }
  grid = newGrid(false); startObj = { y: H - 100 - 50 }; // cars sit on the grid behind the start line, under the lights
  seedTraffic(-260);
  spawnPickup(-450, true); // one nitro canister up the road
  state = "playing";
  startBanner(stageIdx, true);
  sound.ensure();
}

function openMenu(s, index = 0) { state = s; sel = index; }
function toMenu() { initDemo(); openMenu("menu"); }
function pause() { if (state === "playing") { openMenu("paused"); touch.gas = touch.brake = false; } }
function openCamera() { if (state === "playing") { openMenu("camera", cam); touch.gas = touch.brake = false; } }
function startBanner(i, quiet) {
  banner = { idx: i, t: 0 }; if (!quiet) sound.jingle(i);

const menuOY = () => (H - 480) / 2; // how far menus are pushed down to sit in the middle of a tall screen

function btnRect(menu, i) {
  let y = menu.top;

  const w = menu.items[i].big ? 260 : BTN_W;

}

function menuIndexAt(px, py) {

  });
}

function activate(index) {
  const menu = currentMenu();

// one place for menu navigation so keyboard and controller behave identically

  const menu = currentMenu();

    garageIdx = (garageIdx + TEAMS.length + (a === "left" ? -1 : 1)) % TEAMS.length;
    sound.tone(520, 520, 0.05);

    const c = Math.floor(mapIdx / MAP_ROWS), r = mapIdx % MAP_ROWS;

    else if (a === "down") moveMap(Math.min(ROUTE.length - 1, c * MAP_ROWS + Math.min(MAP_ROWS - 1, r + 1)));

  else if (a === "down") { sel = (sel + 1) % n; sound.tone(520, 520, 0.04, "square", 0.03); }

    else if (state === "garage") openMenu("menu", 4);
    else if (state === "options") openMenu("menu", 5);
    else if (state === "over" || state === "cleared") toMenu();

}

// ---------- stages, scenery & weather ----------

function updateStage() {
  const y = level ? level.idx + clamp((dist - level.d0) / level.len, 0, 0.999) : dist / STAGE_LEN, whole = Math.floor(y); // a tour level never drifts into the next city
  stageIdx = whole % ROUTE.length;
  stageFrac = y - whole;
  stA = ROUTE[stageIdx]; stB = ROUTE[(stageIdx + 1) % ROUTE.length];
  const b = stBlend = level ? 0 : smooth((stageFrac - 0.8) / 0.2), A = stA, B = stB; // the last fifth of a stage fades into the next country
  pal = {
    grass: mix(A.g, B.g, b), grassAlt: mix(A.ga, B.ga, b), road: mix(A.rd, B.rd, b),
    sky0: mix(A.s0, B.s0, b), sky1: mix(A.s1, B.s1, b), mount: mix(A.mc, B.mc, b), hill: mix(A.hc, B.hc, b), leaf: mix(A.lf, B.lf, b),
    tint: mix(A.tint, B.tint, b), dark: lerp(A.night, B.night, b), sun: lerp(A.sunA, B.sunA, b), rain: lerp(A.rain, B.rain, b), petals: lerp(A.petals, B.petals, b),
  };
  rainI = pal.rain;
  wind = 0.5 + 0.5 * Math.sin(dist / 240);
  wet += (rainI - wet) * 0.01;
}

const SPONSORS = [["APEX", "#e10600"], ["TURBO OIL", "#ff8000"], ["NITRO X", "#00b2ff"], ["EXTREME RACER", "#7b2cbf"], ["REDLINE", "#d3202a"], ["G-FORCE", "#0a6e5c"], ["PIT STOP", "#ffcc00"]];

function pickKind(table) {
  const total = table.reduce((a, [, w]) => a + w, 0);
  let roll = Math.random() * total;
  for (const [k, w] of table) { if (roll < w) return k; roll -= w; }
  return table[0][0];
}

// near objects sit on the verge; far ones fill the countryside in the 3D views. Each country adds its own props and landmarks.
function sceneTable(st, far) {
  const night = st.night > 0.1, desert = !!st.desert, city = st.horizon === "city";
  return far
    ? [["tree", 0.3], ["bush", desert ? 0.03 : 0.08], ["rock", 0.05], ["dune", desert ? 0.14 : 0], ["building", city ? 0.12 : 0], ["stand", 0.04], ["board", 0.07], ["flag", 0.07]]
    : [["tree", 0.4], ["bush", desert ? 0.04 : 0.1], ["rock", 0.06], ["dune", desert ? 0.18 : 0], ["flag", 0.06], ["lamp", night ? 0.4 : 0.05], ["prop", st.props && st.props.some(p => !p[2]) ? 0.22 : 0]];
}

function pickProp(st, nearOnly) {
  const list = (st.props || []).filter(p => !nearOnly || !p[2]);
  if (!list.length) return null;
  let roll = Math.random() * list.reduce((a, p) => a + p[1], 0);
  for (const p of list) { if (roll < p[1]) return p[0]; roll -= p[1]; }
  return list[0][0];
}

// half-widths of everything that can stand beside the road, so each can be placed with its nearest edge clear of the kerb
const PROP_HALF = { lanternpole: 20, paifang: 48, bamboo: 14, torii: 44, stonelantern: 10, neonsign: 24, flamingo: 10, lifeguard: 16, mapleleaf: 16, yacht: 42, mosaic: 28, chalet: 32, cow: 20, phonebox: 10, bus: 34, sheep: 12, canalhouse: 18, sunflowers: 28, hayroll: 14, tulips: 38, villa: 30, vineyard: 36, osborne: 32, stonearch: 28, orchid: 14, pumpjack: 30, agave: 18, papel: 42, colorhouses: 40, camel: 30 };
const LM_HALF = { opera: 104, bridge: 112, pearl: 44, shtower: 30, pagoda: 58, ferriswheel: 70, artdeco: 46, freedomtower: 34, biosphere: 54, olympictower: 66, casino: 80, palace: 96, sagrada: 104, torreglories: 22, church: 60, fortress: 100, bigben: 70, towerbridge: 104, londoneye: 78, atomium: 68, belfry: 26, parliament: 118, chainbridge: 108, dutchmill: 70, canalhouses: 90, colosseum: 84, pisa: 82, alcala: 66, kiotowers: 56, flame: 56, maiden: 100, heydar: 96, mbs: 116, supertrees: 84, merlion: 60, flyer: 76, capitol: 96, uttower: 30, angel: 42, pyramid: 68, christ: 108, sugarloaf: 132, ponte: 110, sphere: 72, luxor: 106, stratosphere: 26, eiffel: 44, welcome: 40, lusail: 98, aspire: 28, mosque: 124, themepark: 110, yashotel: 106, etihad: 62 };
function sceneHalf(kind, key, r) {
  switch (kind) {
    case "lm": return LM_HALF[key] || 110;
    case "prop": return PROP_HALF[key] || 40;
    case "tree": return r * 1.9;
    case "bush": return r * 1.4;
    case "rock": return r * 1.3;
    case "dune": return r * 1.6;
    case "stand": return 52;
    case "board": return 40;
    case "building": return 30;
    default: return 14;
  }
}

function makeScenery(kind, y, far, st, key) {
  const left = Math.random() < 0.5, side = left ? -1 : 1;
  const r = kind === "tree" ? (far ? rnd(12, 20) : rnd(11, 15)) : kind === "dune" ? rnd(14, 26) : kind === "bush" ? rnd(6, 10) : kind === "rock" ? rnd(5, 8) : 1;
  const x = far ? (left ? 20 : W - 20) : kind === "lamp" ? (left ? ROAD_L - 12 : ROAD_R + 12) : (left ? 8 : ROAD_R + 8) + r + Math.random() * Math.max(0, ROAD_L - 18 - 2 * r);
  let off = kind === "lm" ? rnd(120, 300) : far ? (kind === "building" ? rnd(90, 260) : kind === "stand" ? rnd(70, 200) : rnd(26, 280)) : kind === "lamp" ? rnd(2, 8) : rnd(4, 26);
  off = Math.max(off, sceneHalf(kind, key, r) + 4); // nearest edge stays clear of the road and kerbs
  const o = { kind, key, x, y, r, far, side, half: sceneHalf(kind, key, r), x3: W / 2 + side * (172 + off), v: Math.floor(Math.random() * 3), ph: rnd(0, TAU), fruit: st.fruit };
  if (kind === "tree") o.style = pick(st.trees);
  else if (kind === "flag") o.flag = st.flag;
  else if (kind === "board") o.sponsor = pick(SPONSORS);
  else if (kind === "stand") { o.crowd = Array.from({ length: 3 }, () => Array.from({ length: 14 }, () => pick(st.crowd))); o.roofColor = st.crowd[0]; }
  else if (kind === "building") {
    o.bw = rnd(26, 44); o.bh = rnd(34, 86) * (st.cityH || 1);
    o.bcol = st.bcols ? pick(st.bcols) : st.night > 0.1 ? pick(["#1b1f46", "#232857", "#171a3c"]) : pick(["#8d96a3", "#a8b0bb", "#7b8490", "#b9c0c8"]);
  }
  return o;
}

function spawnScenery(y) {
  const st = Math.random() < stBlend ? stB : stA;
  scenery.push(makeScenery(pickKind(sceneTable(st, false)), y, false, st, pickProp(st, true)));
  scenery.push(makeScenery(pickKind(sceneTable(st, true)), y + rnd(-25, 25), true, st));
  const prop = Math.random() < 0.85 ? pickProp(st, false) : null;
  if (prop) scenery.push(makeScenery("prop", y + rnd(-25, 25), true, st, prop));
  if (st.lms && st.lms.length && Math.random() < 0.17) scenery.push(makeScenery("lm", y + rnd(-25, 25), true, st, pick(st.lms)));
}

function updateWeather() {
  const add = p => { if (wx.length < 300) wx.push(p); };
  if (Math.random() < 0.2 * pal.petals) add({ t: "petal", x: rnd(-20, W + 20), y: -10, vy: rnd(0.6, 1.3), rot: rnd(0, TAU), vr: rnd(-.08, .08), ph: rnd(0, TAU), s: rnd(3, 5), c: pick(["#ffc2dd", "#ffd9e8", "#fff0f6", "#ffadd0"]) });
  for (let i = 0, n = 4 * rainI + (Math.random() < (4 * rainI) % 1 ? 1 : 0); i < Math.floor(n); i++) add({ t: "rain", x: rnd(-30, W + 30), y: -10, vx: -2.2 - wind, vy: rnd(11, 16), len: rnd(10, 18) });
  for (const p of wx) {
    if (p.t === "petal") { p.ph += 0.05; p.x += Math.sin(p.ph) * 0.7 - wind * 0.8; p.y += p.vy + scroll * 0.25; p.rot += p.vr; }
    else { p.x += p.vx; p.y += p.vy; }
  }
  wx = wx.filter(p => p.y < H + 30 && p.x > -90 && p.x < W + 90);
  if (wet > 0.25 && Math.random() < 0.01) roadItems.push({ k: "puddle", x: rnd(ROAD_L + 30, ROAD_R - 30), y: -20, rx: rnd(16, 30), ry: rnd(8, 14) }); // puddles scroll with the road
  for (const it of roadItems) it.y += scroll;
  roadItems = roadItems.filter(it => it.y < H + 30);
}

// ---------- effects ----------

function burst(x, y, colors, n, power) {
  for (let i = 0; i < n && particles.length < 400; i++) {
    const a = rnd(0, TAU), s = rnd(0.5, power);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(20, 45), max: 45, size: rnd(2, 5), color: pick(colors) });
  }
}

// Rain and night change how a city plays, not just how it looks (London, Brussels, Sao Paulo / Singapore, Las Vegas, Doha)
const rainPlay = () => clamp((((stA && stA.rain) || 0) - 0.2) / 0.2, 0, 1);
const nightPlay = () => clamp((((stA && stA.night) || 0) - 0.13) / 0.07, 0, 1);
const nightHide = e => e.kind === "works" ? 0 : nightPlay() * clamp((camRefY - e.y - (lenOf(e) - CAR_H) / 2 - 200) / 120, 0, 1); // far cars: only their tail lights show
let sprayFog = 0, sprayCar = null; // the mist thrown up by the car right ahead of you in the wet

function sprayColor() {
  if (wet > 0.25) return "rgba(205,220,240,0.35)";
  if (stA && stA.desert) return "rgba(225,205,150,0.28)";
  return null;
}

function updateFx() {
  clock++;
  scrollPos += scroll;
  updateStage();
  if (stageIdx !== lastStage) { lastStage = stageIdx; if (state === "playing") startBanner(stageIdx); }
  sceneAcc += scroll;
  if (sceneAcc > 55) { sceneAcc -= 55; spawnScenery(-AHEAD); }
  for (const s of scenery) s.y += scroll;
  scenery = scenery.filter(s => s.y < H + 34);
  updateWeather();
  for (const p of particles) { p.x += p.vx; p.y += p.vy + scroll * 0.8; p.vx *= 0.96; p.vy *= 0.96; p.life--; }
  particles = particles.filter(p => p.life > 0);
  if (racers[0].alive) camOff += ((racers[0].x - W / 2) - camOff) * 0.12; // after a crash the 3D camera stays exactly where it was
  if (racers[0].alive) camRefY = racers[0].y; // the 3D camera stays put once you've crashed
  if (startObj) { startObj.y += scroll; if (startObj.y > camRefY + 500) startObj = null; }
  if (finishObj) finishObj.y += scroll;
  nitroFx += ((racers[0].alive && racers[0].nitro > 0 ? 1 : 0) - nitroFx) * 0.12;
  if (nitroFx > 0.3) shake = Math.max(shake, 1.6 * nitroFx);
  if (banner && ++banner.t > 200) banner = null;
  if (toast && ++toast.t > 150) toast = null;
  kickFx *= 0.93;
  for (const p of pops) p.t++;
  pops = pops.filter(p => p.t < 50);
  shake *= 0.88;
}

// ---------- gameplay ----------

// ---- near misses & combos ----
// A late dodge (pulling out when the car ahead is within ~60 of your nose) or a cut-in (moving over just in front of a car
// you passed) is a near miss: bonus points times the combo, which also multiplies overtakes until it lapses.
const COMBO_T = 180; // frames a combo survives without another near miss
let pops = [], slowT = 0; // "CLOSE!" popups; slow-motion frames left
const COMBO_MAX = 5; // the chain can keep counting, but it never pays more than x5
const comboMult = r => r.comboT > 0 ? clamp(r.combo, 1, COMBO_MAX) : 1;
// Score balance: everything scales with speed, so fast, risky driving always out-scores slow, safe driving.
// An overtake pays 1 point at ~180 km/h or below, 2 at 240, 3 at 300, 4 at 360... with no ceiling.
const passPoints = v => Math.max(1, Math.round((v * 60 - 120) / 60));
const SPEED_PAR = 90; // World Tour: every second under 90 s at the finish is worth 4 points
function nearMiss(r) {
  r.combo = (r.comboT > 0 ? r.combo : 0) + 1; r.comboT = COMBO_T;
  r.score += 5 * passPoints(r.v) * comboMult(r); // a close shave at speed is worth more
  if (r.ai) return;
  pops.push({ r, text: r.combo > 1 ? `CLOSE! x${r.combo}` : "CLOSE!", t: 0 });
  sound.whoosh();
  if (r.combo >= 5 && r.combo % 5 === 0) slowT = 14; // a beat of slow motion on big combos
}

function setLane(r, lane) {
  if (lane === r.lane) return;
  r.fromLane = r.lane;
  r.lane = lane;
  r.lastMove = frame;
  if (state !== "playing" || !grid.done) return;
  for (const e of enemies) {
    const ahead = r.y - e.y; // > 0: it's in front of us
    if (e.lane === r.fromLane && ahead > 0 && ahead < CAR_H + 60) (e.dodged = e.dodged || {})[r.id] = true; // late dodge: pays out as we pass it
    if (e.lane === lane && e.passed[r.id] && -ahead < CAR_H + 40) nearMiss(r); // cut in right in front of it
  }
}

function steer(r, dir) {
  if (!r || !r.alive || !grid.done) return;
  setLane(r, clamp(r.lane + dir, 0, LANES - 1));
}

const KEYS = {
  p1: { up: ["ArrowUp"], down: ["ArrowDown"] },
  shared: { up: ["ArrowUp", "KeyW"], down: ["ArrowDown", "KeyS"] },
  p2: { up: ["KeyW"], down: ["KeyS"] },
};

// the two pedals, 0..1 each: analog from a controller's triggers, digital from keys / touch
function pedals(r) {
  const set = mode === "multi" ? (r.id === 0 ? KEYS.p1 : KEYS.p2) : KEYS.shared;
  let gas = set.up.some(k => held.has(k)) ? 1 : 0, brake = set.down.some(k => held.has(k)) ? 1 : 0;
  if (r.id === 0) { if (touch.gas) gas = 1; if (touch.brake) brake = 1; }
  return { gas: Math.max(gas, padG[r.id] || 0), brake: Math.max(brake, padB[r.id] || 0) };
}
const throttleFor = r => { const p = pedals(r); return clamp(p.gas - p.brake, -1, 1); }; // -1..1 while driving

// ---- traffic: plain road cars, then lane-changers, long trucks and roadworks, introduced gradually ----
const ROAD_COLS = ["#f2f2f0", "#b9bec6", "#2a2c31", "#c0392b", "#2f5fa8", "#7d838c", "#2f6b4f", "#d8c9a3", "#8a1f2b", "#e0e3e8"];
const TRUCK_LEN = 160, WORKS_LEN = 420, SIGN_AHEAD = 650; // roadworks: the warning sign stands this far before the cones
const lenOf = e => e.len || CAR_H;
const NEW_KINDS = { changer: "NEW: Lane changers - watch the blinkers", truck: "NEW: Trucks - longer to pass", works: "NEW: Roadworks - cones close a lane", shield: "NEW: Shield - absorbs one crash" };
let seenKinds = store.get("seenKinds", []);
// World Tour adds a new kind every few cities; Endless as you pass cars (the menu's demo traffic stays plain)
function trafficKinds() {
  const p = racers ? Math.max(0, ...racers.map(r => r.passed)) : 0;
  const has = (city, cars) => state === "playing" && (level ? level.idx >= city : p >= cars);
  return { changer: has(3, 20), truck: has(6, 40), works: has(10, 70) };
}
// is this stretch of a lane taken? (lengths count, so trucks and roadworks block what they really cover)
const laneBusy = (lane, y, len, pad, skip) => enemies.some(o => o !== skip && o.lane === lane && Math.abs(o.y - y) < (lenOf(o) + len) / 2 + pad);
function wouldWall(lane, y, len, skip) { // something in all three lanes within a short stretch would leave no way through
  const near = new Set([lane]);
  for (const o of enemies) if (o !== skip && Math.abs(o.y - y) < (lenOf(o) + len) / 2 + 148) near.add(o.lane);
  return near.size >= LANES;
}

function spawnEnemyAt(y) {
  const k = trafficKinds(), roll = Math.random();
  let kind = "car";
  if (k.works && roll < 0.05 && !enemies.some(o => o.kind === "works")) kind = "works";
  else if (k.truck && roll < 0.17) kind = "truck";
  else if (k.changer && roll < 0.35) kind = "changer";
  const len = kind === "truck" ? TRUCK_LEN : kind === "works" ? WORKS_LEN : CAR_H, yc = y - (len - CAR_H) / 2; // long things stretch on up the road
  for (let tries = 0; tries < 4; tries++) {
    const lane = Math.floor(Math.random() * LANES);
    if (laneBusy(lane, yc, len, 70) || wouldWall(lane, yc, len)) continue; // spot taken, or it would wall off the road
    enemies.push({ kind, lane, x: laneX(lane), y: yc, len, col: pick(ROAD_COLS), passed: {}, miss: {} });
    return;
  }
}
const spawnEnemy = () => spawnEnemyAt(-AHEAD);
// Against an Impossible CPU, keep cars far enough apart that a clean line always exists (otherwise nobody could survive the walls the spawner can create)
const trafficGap = () => racers.some(r => r.ai === DIFFS.impossible) ? 210 : 100;
function seedTraffic(y0 = -60) { const lo = trafficGap() > 100 ? 220 : 150; let y = y0; while ((y -= rnd(lo, lo + 110)) > -AHEAD + 40) spawnEnemyAt(y); } // the road is already busy when you arrive

function spawnPickup(y = -AHEAD, forceNitro = false) {
  const lane = Math.floor(Math.random() * LANES);
  if (laneBusy(lane, y, 20, 150)) return; // never in a closed lane or under a car
  if (forceNitro || Math.random() < 0.3) pickups.push({ type: !forceNitro && Math.random() < 0.25 ? "shield" : "nitro", lane, x: laneX(lane), y }); // a rare shield instead of nitro
  else for (let i = 0; i < 4; i++) pickups.push({ type: "coin", lane, x: laneX(lane), y: y - i * 45 });
}

// Time-aware planner (Impossible): simulate every lane over the next stretch of road in short steps and pick the move
// that keeps the car alive longest, so it escapes staggered walls of traffic that a one-step dodge can't.
function aiPlan(r, p, look, ready, clearance) {
  const v = Math.max(r.v, 1), DT = 4, N = clamp(Math.ceil(look / (v * DT)), 4, 26), margin = CAR_H - 6 + 16;
  const safe = Array.from({ length: N + 2 }, () => [true, true, true]);
  for (const e of enemies) {
    const d0 = r.y - e.y, ext = (lenOf(e) - CAR_H) / 2; // d0 > 0: it's ahead of us; ext: how much longer than a car it is at each end
    if (d0 > look + 80 + ext || d0 < -margin - ext - 10) continue;
    for (let t = 0; t <= N + 1; t++) if (Math.abs(d0 - v * DT * t) < margin + ext) safe[t][e.lane] = false;
  }
  const surv = Array.from({ length: N + 2 }, () => [0, 0, 0]); // how many steps we can keep going from (step, lane)
  for (let t = N + 1; t >= 0; t--) for (let l = 0; l < LANES; l++) {
    if (!safe[t][l]) continue;
    if (t === N + 1) { surv[t][l] = 1; continue; }
    let best = 0;
    for (let l2 = Math.max(0, l - 1); l2 <= Math.min(LANES - 1, l + 1); l2++) {
      if (l2 !== l && !(safe[t][l2] && safe[t + 1][l])) continue; // can only cross while both lanes are clear
      if (safe[t + 1][l2]) best = Math.max(best, surv[t + 1][l2]);
    }
    surv[t][l] = 1 + best;
  }
  if (!ready) return;
  const cur = r.lane;
  let bestLane = cur, bestVal = -1;
  for (let l2 = Math.max(0, cur - 1); l2 <= Math.min(LANES - 1, cur + 1); l2++) {
    if (l2 !== cur && !(safe[0][l2] && safe[1][cur])) continue;
    if (!safe[1][l2]) continue;
    let val = surv[1][l2];
    if (val >= N) { // several fully safe options: staying put is best, then lanes with coins or nitro ahead
      val += l2 === cur ? 0.5 : 0;
      if (p.greedy && pickups.some(k => k.lane === l2 && r.y - k.y > 0 && r.y - k.y < look * 0.6)) val += 0.8;
    }
    if (val > bestVal) { bestVal = val; bestLane = l2; }
  }
  if (bestLane !== cur) setLane(r, bestLane);
}

// Lane-change decision: dodge when a car in our lane is within sight, preferring the neighbour with more room.
function aiThink(r) {
  const p = r.ai;
  if (!aiGo() || frame < r.nextThink) return;
  r.nextThink = frame + p.think;
  const look = p.look * Math.max(1, r.v / 2); // look further the faster we go

  const clearance = lane => {
    let c = Infinity;
    for (const e of enemies) {
      if (e.lane !== lane) continue;
      if (e.miss[r.id] === undefined) e.miss[r.id] = Math.random() < p.miss;
      if (e.miss[r.id]) continue;
      const ext = (lenOf(e) - CAR_H) / 2, d = r.y - e.y - ext; // > 0: its tail is ahead of us
      if (d > -CAR_H - 2 * ext && d < look) c = Math.min(c, d);
    }
    return c;
  };

  const ready = frame - r.lastMove >= p.cooldown;
  const here = clearance(r.lane);

  if (p.plan) { aiPlan(r, p, look, ready, clearance); return; }

  if (here === Infinity) {
    if (p.greedy && ready) {
      const pk = pickups.filter(k => Math.abs(k.lane - r.lane) === 1 && r.y - k.y > 0 && r.y - k.y < look * 0.7).sort((a, b) => b.y - a.y)[0];
      if (pk && clearance(pk.lane) === Infinity) setLane(r, pk.lane);
    }
    return;
  }
  if (!ready) return;
  let bestLane = r.lane, bestC = here;
  for (const l of [r.lane - 1, r.lane + 1]) {
    if (l < 0 || l >= LANES) continue;
    const c = clearance(l);
    if (c > bestC + 60 || (c === Infinity && bestC !== Infinity)) { bestLane = l; bestC = c; }
  }
  setLane(r, bestLane);
}

function stepRacers() {
  for (const r of racers) {
    const px = r.x;
    if (r.alive) {
      r.x += (laneX(r.lane) - r.x) * (0.3 - 0.09 * rainPlay()); // wet road: lane changes take a little longer
      // slower than the pace car -> slip back down the screen; the spring pulls you back when you keep up
      if (level && level.final && r.ai) r.y = clamp(r.y + (speed - r.v), -AHEAD + 60, H + 400); // the final's CPU sits at its true distance from you, on screen or not
      else r.y = clamp(r.y + (speed - r.v) - 0.015 * (r.y - r.ty), 80, H - 38);
      const target = clamp(Math.atan2(r.x - px, 10), -0.45, 0.45);
      r.tilt += (target - r.tilt) * 0.3;
    } else {
      r.y += scroll; // wrecks get left behind
      if (r.deadT++ < 30) r.x += r.drift; // ...and slide only briefly, they don't wander off the road forever
      r.tilt = Math.min(r.tilt + 0.12, 2.6);
    }
  }
}

function updateDemo() {
  frame++;
  speed = scroll = 2.8;
  for (const r of racers) { r.v = 2.8; aiThink(r); }
  dist += speed;
  spawnAcc += speed;
  if (spawnAcc > 170) { spawnAcc = 0; spawnEnemy(); }
  for (const e of enemies) e.y += speed;
  enemies = enemies.filter(e => e.y - lenOf(e) / 2 < H + CAR_H);
  stepRacers();
}

// ---- nitro you control: canisters fill up to 3 charges; Space / Shift, RB or the NITRO button fires one ----
const NITRO_CHARGES = 3;
let kickFx = 0; // the camera kick when you fire (chase & cockpit views)
function fireNitro(r) {
  if (!r || !r.alive || state !== "playing" || !grid.done) return;
  if (!(r.charges > 0) || r.nitro > 0) { if (!r.ai) sound.tone(200, 160, 0.08, "square", 0.03); return; } // empty, or one is already burning
  r.charges--;
  r.cruise = r.v; // the speed you'd be doing without it
  r.nitro = NITRO_FRAMES;
  burst(r.x, r.y + 30, ["#5fd4ff", "#ffffff", "#2a7bff"], 18, 4);
  if (!r.ai) { sound.nitroStart(); if (r.id === 0) kickFx = 1; }
}
function nitroBtn() { const g = pedalRects().gas; return { x: g.x + g.w / 2, y: g.y - 44, r: 30 }; } // touch: just above the gas pad

function collect(r, k) {
  if (k.type === "shield") {
    r.shield = true;
    burst(k.x, k.y, ["#7fffff", "#ffffff", "#3ad0ff"], 16, 3);
    if (!r.ai) sound.tone(400, 1200, 0.25, "sine", 0.07);
    return;
  }
  if (k.type === "nitro") {
    r.charges = Math.min(NITRO_CHARGES, (r.charges || 0) + 1);
    burst(k.x, k.y, ["#5fd4ff", "#ffffff", "#2a7bff"], 14, 3);
    if (!r.ai) sound.tone(520, 1040, 0.14, "triangle", 0.06);
    return;
  }
  r.coins++; r.score += 5;
  if (r.id === 0 || mode === "multi") { wallet++; store.set("coins", wallet); }
  sound.coin();
}

function rumble() {
  try {
    for (const g of navigator.getGamepads()) {
      if (g && g.vibrationActuator) g.vibrationActuator.playEffect("dual-rumble", { duration: 350, strongMagnitude: 1, weakMagnitude: 0.7 });
    }
  } catch (e) {}
}

// The round ends the instant anyone crashes: the other car wins (or the higher score if both go at once).
function endRound(beaten = false) {
  state = "over";
  overAt = performance.now();
  sel = 0;
  touch.gas = touch.brake = false;
  const [a, b] = racers;
  if (mode === "single") result = "Crash!";
  else if (mode === "tour") { if (!beaten) result = "City failed!"; }
  else {
    const w = a.alive ? a : b.alive ? b : a.score === b.score ? null : a.score > b.score ? a : b;
    result = !w ? "Draw!" : mode === "vs" ? (w === a ? "You win!" : "CPU wins!") : `${w.label} wins!`;
  }
  if (mode === "single" && a.score > best) { best = a.score; newBest = best > 0; store.set("best", best); }
  sound.silence();
  if (!beaten) { sound.thud(); rumble(); }
}

function updatePlaying() {
  frame++;
  if (steerHint && hasTouch && grid.done && (steerTaps >= 2 || frame > grid.goFrame + 360)) { steerHint = false; store.set("steerHint", true); } // got the idea
  const top = Math.max(...racers.map(r => r.passed));
  const vmin = level ? tourParams(level.idx).vmin : Math.min(1 + tier * 0.15, 4.4); // Endless: the pace rises every 10 cars passed (up to 264 km/h); a tour city has its own floor
  if (Math.floor(top / 10) > tier) tier = Math.floor(top / 10);

  // the start lights: five reds come on one by one, hold for a random moment, then turn green
  if (!grid.done) {
    grid.t++;
    const lit = Math.min(5, Math.floor(grid.t / GRID_STEP));
    if (lit > grid.lit) { grid.lit = lit; sound.tone(560, 560, 0.14, "square", 0.05); }
    if (grid.lit === 5 && grid.hold < 0) grid.hold = Math.round(rnd(40, 120)); // a random wait, so nobody can guess it
    if (grid.lit === 5 && grid.t >= 5 * GRID_STEP + grid.hold) { grid.done = true; grid.goFrame = frame; sound.tone(980, 980, 0.4, "square", 0.06); }
  }

  // throttle / brake (nitro takes over completely while it burns)
  for (const r of racers) {
    if (!r.alive) continue;
    if (!grid.done) { // on the grid: hold brake + throttle to build revs; going without the brake held is a false start
      r.v = 0; r.braking = false;
      if (!r.ai) {
        const pd = pedals(r);
        r.rev += clamp((pd.brake > 0.3 ? pd.gas : 0) - r.rev, -0.08, 0.05);
        if (pd.gas > 0.3 && pd.brake < 0.3 && !r.falseStart) { r.falseStart = true; if (r.id === 0) say("FALSE START!  +1s"); }
      }
      continue;
    }
    const since = frame - grid.goFrame, boost = r.nitro > 0;
    if (r.ai && since < AI_REACT) { r.v = 0; continue; } // the CPU reacts 0.100s after green, every time
    if (boost) {
      r.nitro--; r.braking = false;
      r.cruise += accelAt(r.cruise); // flat-out throttle keeps counting underneath the boost
      r.v = Math.min(r.v + 0.1, r.cruise + NITRO_PUSH);
      if (r.nitro === 0 && r.id === 0) sound.nitroEnd();
    } else if (r.ai) {
      const target = clamp(r.ai.speed + tier * 0.12, vmin, VMAX);
      r.v += clamp(target - r.v, -0.04, Math.min(r.ai.accel || 0.03, accelAt(r.v))); // same car, same physics
      r.braking = target < r.v - 0.02;
    } else {
      const pd = pedals(r);
      let t = clamp(pd.gas - pd.brake, -1, 1);
      if (r.falseStart && since < 60) { t = 0; r.rev = 0; } // the one-second penalty for jumping the lights
      else if (!r.launched) {
        r.rev += clamp((pd.brake > 0.3 ? pd.gas : 0) - r.rev, -0.08, 0.05); // you can keep revving after green until you decide to go
        if (pd.gas > 0.3 && pd.brake < 0.3) { // brake off, throttle on: away you go, instantly, harder the more revs you built
          r.launched = true; r.reaction = since; r.v = Math.max(r.v, 0.4 + 1.5 * r.rev); r.rev = 0;
          if (r.id === 0 && !r.falseStart) say(`Reaction ${(since / 60).toFixed(3)}s${mode === "vs" ? "   CPU 0.100s" : ""}`);
        }
      }
      r.v += t > 0 ? accelAt(r.v) * t : 0.05 * t; // brakes ~5g, like the real thing
      r.braking = t < -0.05;
    }
    if (!boost && r.cruise !== undefined) { // nitro wears off: ease back down to where the throttle alone would have got you
      if (r.v > r.cruise + 0.06) r.v -= 0.06;
      else r.cruise = undefined; // back to normal: the throttle's in charge again
    }
    if (!r.rolling && r.v >= vmin) r.rolling = true; // the pace floor only applies once you're up to speed
    r.v = Math.max(r.v, r.rolling ? vmin : 0);       // no top speed: keep your foot down and it keeps climbing
  }
  const live = racers.filter(r => r.alive);
  if (live.length) speed = level && level.final && racers[0].alive ? racers[0].v : Math.max(...live.map(r => r.v)); // the camera follows the fastest car (in the Grand Final: you)
  scroll = speed;
  dist += speed;

  const g = gearOf(racers[0].v); // shift sounds follow the player's gear
  if (g !== lastGear) { if (lastGear && grid.done) sound.shift(g > lastGear); lastGear = g; }

  if (level && !finishObj) { // the finish line appears up the road so it crosses the car exactly at the end of the level
    const left = level.d0 + level.len - dist;
    if (left < AHEAD - 100) finishObj = { y: racers[0].y - left };
  }
  if (grid.done && !finishObj) { // nothing new spawns past the finish line
    spawnAcc += speed;
    const gap = level ? tourParams(level.idx).gap : Math.max(trafficGap(), SPAWN_PX - Math.floor(top / 3) * 4);
    if (spawnAcc >= gap) { spawnAcc -= gap; spawnEnemy(); }
    pickupAcc -= speed;
    if (pickupAcc <= 0) { spawnPickup(); pickupAcc = rnd(520, 960); }
  }

  const spray = sprayColor(), rp = rainPlay(), p0 = racers[0];
  let fogT = 0; sprayCar = null;
  if (rp > 0) for (const e of enemies) {
    if (e.kind === "works") continue;
    const d = p0.y - e.y - (lenOf(e) - CAR_H) / 2; // from its tail
    if (d > 0 && d < 400 && frame % 4 === 0 && particles.length < 320) particles.push({ x: e.x + rnd(-14, 14), y: e.y + 34, vx: rnd(-.6, .6), vy: rnd(.6, 1.6), life: 20, max: 40, size: rnd(3, 5.5), color: "rgba(215,225,240,0.4)" });
    if (d > 0 && d < 280 && Math.abs(e.x - p0.x) < 40) { const k = 1 - d / 280; if (k > fogT) { fogT = k; sprayCar = e; } } // right behind it in your lane
  }
  sprayFog += (rp * fogT - sprayFog) * 0.08;
  if (slowT > 0) slowT--;
  for (const r of racers) {
    if (r.comboT > 0 && --r.comboT === 0) r.combo = 0; // the chain lapses
    if (r.ghost > 0) r.ghost--;
    if (r.ai && r.alive) { aiThink(r); if (r.charges > 0 && !(r.nitro > 0)) fireNitro(r); } // the CPU uses nitro as soon as it has it
    if (!r.alive || particles.length > 320) continue;
    if (frame % 3 === 0 && spray && r.v > 2) {
      for (const sx of [-18, 18]) particles.push({ x: r.x + sx, y: r.y + 30, vx: rnd(-.5, .5), vy: rnd(.4, 1.4), life: 18, max: 45, size: rnd(2.5, 4.5), color: spray });
    }
    if (r.nitro > 0) {
      for (let i = 0; i < 2; i++) particles.push({ x: r.x + rnd(-6, 6), y: r.y + 38, vx: rnd(-.8, .8), vy: rnd(3, 6), life: 14, max: 20, size: rnd(2, 4.5), color: pick(["#5fd4ff", "#ffffff", "#2a7bff", "#bfeaff"]) });
    }
    if (r.v > 4.7 && frame % 2 === 0) {
      particles.push({ x: r.x + rnd(-5, 5), y: r.y + 34, vx: rnd(-1.6, 1.6), vy: rnd(.8, 2.6), life: 11, max: 20, size: rnd(1.4, 2.6), color: pick(["#ffb347", "#fff2a8", "#ff8c1a"]) });
    }
  }
  stepRacers();

  for (const k of pickups) {
    k.y += speed;
    if (k.type === "shield" && k.y > 0 && !seenKinds.includes("shield")) { seenKinds.push("shield"); store.set("seenKinds", seenKinds); say(NEW_KINDS.shield); }
    for (const r of racers) {
      if (level && r.ai) continue; // the Grand Final CPU leaves pickups alone: a steady, readable rival
      if (r.alive && Math.abs(k.x - r.x) < 26 && Math.abs(k.y - r.y) < 42) {
        collect(r, k); k.taken = true;
        if (k.type === "coin") burst(k.x, k.y, ["#ffd23f", "#fff3b0"], 8, 2.5);
        break;
      }
    }
  }
  pickups = pickups.filter(k => !k.taken && k.y < H + 20);

  for (const e of enemies) {
    e.y += speed;
    if (e.kind === "changer" && !e.moved) { // blink for a second, then move over (only into a clear lane)
      const ahead = racers[0].y - e.y, ok = l => l >= 0 && l < LANES && !laneBusy(l, e.y, CAR_H, 60, e) && !wouldWall(l, e.y, CAR_H, e);
      if (!e.blink && ahead > 0 && ahead < 450) { const opts = [e.lane - 1, e.lane + 1].filter(ok); if (opts.length) { e.to = pick(opts); e.blink = 60; } else e.moved = true; }
      else if (e.blink && --e.blink === 0) { if (ok(e.to)) e.lane = e.to; e.moved = true; }
    }
    e.x += (laneX(e.lane) - e.x) * 0.06;
    if (e.kind !== "car" && !seenKinds.includes(e.kind) && e.y + lenOf(e) / 2 + (e.kind === "works" ? SIGN_AHEAD : 0) > 0) { // first sighting ever
      seenKinds.push(e.kind); store.set("seenKinds", seenKinds); say(NEW_KINDS[e.kind]);
    }
    const reach = (lenOf(e) + CAR_H) / 2; // centre-to-centre distance at which it touches a car
    for (const r of racers) {
      if (!r.alive) continue;
      if (!e.passed[r.id] && e.y > r.y + reach) {
        e.passed[r.id] = true;
        if (e.kind !== "works") { // cones don't count as overtakes
          r.passed++;
          r.score += passPoints(r.v) * comboMult(r); // fast overtakes pay more, and the combo multiplies them
        }
        if (e.dodged && e.dodged[r.id]) nearMiss(r);
      }
      const hitX = Math.abs(e.x - r.x) < CAR_W - 4;
      const hitY = Math.abs(e.y - r.y) < reach - 6;
      if (hitX && hitY && r.ghost > 0) continue; // still flashing from a bump: no second hit
      if (hitX && hitY && r.shield) { shieldBreak(r); continue; } // the shield takes it

  else if (finishObj && finishObj.y >= racers[0].y - CAR_H / 2) finishLevel(); // nose over the line
  else if (finishObj && level.final && racers[1].alive && finishObj.y >= racers[1].y - CAR_H / 2) { result = "CPU won the final!"; endRound(true); } // beaten to the line
  if (level && state === "playing") { // a little fanfare the moment a star target is beaten
    const tg = starTargets(level.idx), now = 1 + (racers[0].score >= tg[0]) + (racers[0].score >= tg[1]);
    if (now > (level.starNow || 1)) { level.starNow = now; say(`${now}-star score reached!`); sound.tone(880, 1760, 0.18, "triangle", 0.07); }
  }
}

// Crossed the finish line of a World Tour city

function shieldBreak(r) {

}

function finishLevel() {
  state = "cleared"; overAt = performance.now(); sel = 0; toast = null; // nothing covering the results
  touch.gas = touch.brake = false;
  levelTime = (frame - grid.goFrame) / 60;
  level.bonus = Math.max(0, Math.round((SPEED_PAR - levelTime) * 4)); racers[0].score += level.bonus; // the quicker the finish, the bigger the bonus
  if (level.idx + 1 > tourCleared) { tourCleared = level.idx + 1; store.set("tourCleared", tourCleared); }
  const tg = starTargets(level.idx), got = 1 + (racers[0].score >= tg[0]) + (racers[0].score >= tg[1]);
  const prev = cityStars[level.idx] || 0;

  sound.silence(); sound.jingle(level.idx);
  burst(racers[0].x, racers[0].y - 40, ["#ffd23f", "#ffffff", "#3dff6e", "#5fd4ff"], 50, 6);
}

// ---------- controller ----------

const padPrev = {};

function pollPads() {
  padG = [0, 0]; padB = [0, 0];
  const list = (typeof navigator !== "undefined" && navigator.getGamepads) ? navigator.getGamepads() : [];
  const pads = Array.from(list || []).filter(g => g && g.connected);
  hasPad = pads.length > 0;
  pads.forEach((g, k) => {
    const b = i => !!(g.buttons[i] && g.buttons[i].pressed), val = i => (g.buttons[i] ? g.buttons[i].value : 0);
    const ax = g.axes[0] || 0, ay = g.axes[1] || 0;
    const now = { left: ax < -0.5 || b(14), right: ax > 0.5 || b(15), up: ay < -0.5 || b(12), down: ay > 0.5 || b(13), a: b(0), b: b(1), y: b(3), rb: b(5), start: b(9), back: b(8) };
    const prev = padPrev[g.index] || {}, edge = n => now[n] && !prev[n];
    padPrev[g.index] = now;

    if (state === "playing") {
      const rid = mode === "multi" && pads.length > 1 ? k : 0; // a second controller drives player 2
      if (rid > 1 || (mode !== "multi" && k > 0)) return;
      if (edge("left")) steer(racers[rid], -1);
      if (edge("right")) steer(racers[rid], 1);
      const gas = Math.max(val(7), b(0) ? 1 : 0, now.up ? 1 : 0), brake = Math.max(val(6), b(1) ? 1 : 0, b(2) ? 1 : 0, now.down ? 1 : 0);
      padG[rid] = gas; padB[rid] = brake;
      if (edge("rb")) fireNitro(racers[rid]);
      if (edge("start")) pause();
      else if (edge("y") || edge("back")) openCamera();
    } else if (k === 0) {
      if (edge("up")) menuAction("up");
      if (edge("down")) menuAction("down");
      if (edge("left")) menuAction("left");
      if (edge("right")) menuAction("right");
      if (edge("a")) menuAction("confirm");
      if (edge("b") || edge("start")) menuAction("back");
      if (edge("y")) menuAction("next");
    }
  });
}

function update() {
  pollPads();
  if (state === "paused" || state === "camera") return;
  if (state === "playing") updatePlaying();
  else if (state === "over") { scroll = view3D() === 0 ? 1 : 0; stepRacers(); }
  else if (state === "cleared") { // coast to a stop past the line
    speed *= 0.97; scroll = speed; dist += speed;
    for (const e of enemies) e.y += speed;
    for (const r of racers) if (r.alive) r.v = speed;
    stepRacers();
  }
  else updateDemo();
  updateFx();
  if (starAnim && state === "cleared" && starAnim.shown < starAnim.got && ++starAnim.t >= 28) { // pop the next star
    starAnim.t = 0; const i = starAnim.shown++, sx = W / 2 + (i - 1) * 64;
    sound.tone(660 * (1 + i * 0.26), 1320 * (1 + i * 0.26), 0.3, "triangle", 0.09); sound.burst(0.25, 0.25, "highpass", 5000, 9000);
    for (let k = 0; k < 26; k++) { const a = rnd(0, TAU), s = rnd(1, 4.5); uiFx.push({ x: sx, y: 270, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(25, 45), color: pick(["#ffd23f", "#fff3b0", "#ffffff", "#ffb347"]) }); }
  }
  for (const p of uiFx) { p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.vx *= 0.97; p.life--; }
  uiFx = uiFx.filter(p => p.life > 0);
  sound.engineTick(state === "playing", effV(racers[0]), racers[0].nitro > 0);
  if (state === "playing" && racers[0].rev > 0.9 && Math.random() < 0.12) sound.burst(0.05, 0.4, "lowpass", 900, 260); // rev-limiter pops
  sound.envTick(state === "playing", Math.max(rainI, wet), 0, 0);
  music.tick(state === "menu" || state === "tutorial" || state === "difficulty" || state === "garage" || state === "options" || state === "map");
}

// ---------- tile textures (pre-rendered once per resolution) ----------

let RES = 1, roadPat = null, grassPat = null;

function makeTile(draw) {
  try {
    const k = Math.ceil(RES), c = document.createElement("canvas");
    c.width = c.height = 128 * k;
    const g = c.getContext("2d");
    g.scale(k, k);
    draw(g);
    const pat = ctx.createPattern(c, "repeat");
    if (pat && pat.setTransform && typeof DOMMatrix !== "undefined") pat.setTransform(new DOMMatrix().scale(1 / k));
    return pat;
  } catch (e) { return null; }
}

function initTiles() {
  roadPat = makeTile(g => {
    for (let i = 0; i < 1100; i++) {
      g.fillStyle = Math.random() < 0.5 ? "rgba(255,255,255,0.06)" : "rgba(0,0,0,0.12)";
      g.fillRect(Math.random() * 128, Math.random() * 128, rnd(0.8, 2.2), rnd(0.8, 2.2));
    }
  });
  grassPat = makeTile(g => {
    g.lineWidth = 1;
    for (let i = 0; i < 700; i++) {
      const x = Math.random() * 128, y = Math.random() * 128;
      g.strokeStyle = Math.random() < 0.5 ? "rgba(255,255,255,0.12)" : "rgba(0,0,0,0.12)";
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + rnd(-2, 2), y - rnd(3, 7)); g.stroke();
    }
  });
}

// Everything standing on the old road moves when the road moves (the window was resized or went full screen)
function rescaleWorld(oldL, oldR) {
  const dL = ROAD_L - oldL, ratio = oldL > 0 ? ROAD_L / oldL : 1;
  for (const o of [...(enemies || []), ...(pickups || []), ...(racers || []), ...(roadItems || [])]) o.x += dL;
  for (const o of scenery || []) o.x = o.x < oldL + (oldR - oldL) / 2 ? o.x * ratio : ROAD_R + (o.x - oldR) * ratio;
}

// The screen got taller or shorter: the world stays pinned to the bottom edge, so the new space at the top is more road ahead
function reheightWorld(dH) {
  for (const o of [...(enemies || []), ...(pickups || []), ...(racers || []), ...(roadItems || []), ...(scenery || []), ...(particles || []), ...(wx || [])]) {
    o.y += dH; if (o.ty !== undefined) o.ty += dH;
  }
  if (startObj) startObj.y += dH;
  if (finishObj) finishObj.y += dH;
  camRefY += dH;
}

function fit() { // fill the whole window; render at the real on-screen pixel size so everything stays sharp
  if (typeof window === "undefined") return;
  const aspect = window.innerWidth / window.innerHeight;
  let newW = Math.round(480 * aspect), newH = 480;
  if (newW < 340) { newW = 340; newH = clamp(Math.round(340 / aspect), 480, 820); } // portrait phone: keep the road's width, grow taller
  newW = Math.min(newW, 1100);
  if (newW !== W) { const oL = ROAD_L, oR = ROAD_R; W = newW; ROAD_L = (W - ROAD_W) / 2; ROAD_R = ROAD_L + ROAD_W; rescaleWorld(oL, oR); }
  if (newH !== H) { const dH = newH - H; H = newH; reheightWorld(dH); }
  let cssH = window.innerHeight, cssW = cssH * W / H;
  if (cssW > window.innerWidth) { cssW = window.innerWidth; cssH = cssW * H / W; }
  canvas.style.width = cssW + "px"; canvas.style.height = cssH + "px";
  const res = clamp((window.devicePixelRatio || 1) * cssH / H, 1, 3);
  if (Math.abs(res - RES) < 0.01 && roadPat && canvas.width === Math.round(W * res) && canvas.height === Math.round(H * res)) return;
  RES = res;
  canvas.width = Math.round(W * RES);
  canvas.height = Math.round(H * RES);
  initTiles();
}

function toggleFullscreen() {
  try {
    const d = document, el = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else { const r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (r && r.catch) r.catch(() => {}); }
  } catch (e) {}
}

// the wall of spray off the car right ahead: the road beyond it goes misty until you pull out of its wake

// ---------- drawing: scenery ----------

function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fill(); }

const sandColor = () => rgb(mix(pal.grass, [255, 240, 205], 0.3));

// overhead versions: plain simple shapes
function drawScenery(s) { // attractions and props shrink down into little roadside sprites
  const sway = Math.sin(clock / 50 + s.ph) * (0.6 + wind * 1.2);
  if (s.kind === "lm" || s.kind === "prop") {
    ctx.save(); ctx.translate(s.x, s.y); const k = s.kind === "lm" ? 0.26 : 0.5; ctx.scale(k, k);
    (s.kind === "lm" ? LMS : PROPS)[s.key](s);

  }

    case "tree":
      ctx.fillStyle = "rgba(0,0,0,0.22)"; circle(s.x + s.r * 0.35, s.y + s.r * 0.4, s.r);
      if (s.style === "pine") {
        ctx.fillStyle = rgb(PINE); circle(s.x, s.y, s.r);
        ctx.strokeStyle = rgb(mix(PINE, [0, 0, 0], 0.4)); ctx.lineWidth = 1; ctx.beginPath();
        for (let i = 0; i < 8; i++) { const a = i / 8 * TAU; ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + Math.cos(a) * s.r * 0.95, s.y + Math.sin(a) * s.r * 0.95); }
        ctx.stroke();
      } else if (s.style === "palm") {
        ctx.strokeStyle = "#2f8a3a"; ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.beginPath();
        for (let i = 0; i < 7; i++) { const a = i / 7 * TAU + sway * 0.05; ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + Math.cos(a) * s.r * 1.2, s.y + Math.sin(a) * s.r * 1.2); }

      } else if (s.style === "cypress") {
        ctx.fillStyle = rgb(mix(PINE, [0, 0, 0], 0.25)); circle(s.x, s.y, s.r * 0.55); ctx.fillStyle = "rgba(255,255,255,0.12)"; circle(s.x - 1, s.y - 1, s.r * 0.25);
      } else if (s.style === "cactus") {
        ctx.fillStyle = "#3f8a4a"; circle(s.x, s.y, s.r * 0.5); ctx.fillRect(s.x - s.r * 0.9, s.y - 2, s.r * 1.8, 4); ctx.fillStyle = "#56a560"; circle(s.x - 1, s.y - 1, s.r * 0.22);
      } else {

        ctx.fillStyle = rgb(mix(pal.leaf, [255, 255, 255], 0.25), 0.85); circle(s.x - s.r * 0.25 + sway * 0.3, s.y - s.r * 0.28, s.r * 0.55);
        if (s.style === "fruit" && s.fruit) { ctx.fillStyle = s.fruit; for (let i = 0; i < 5; i++) circle(s.x + Math.cos(i * 2.4) * s.r * 0.6, s.y + Math.sin(i * 2.4) * s.r * 0.6, 1.5); }
      }

    case "bush":

function drawRoadItem(it) { // puddles
  ctx.fillStyle = `rgba(140,170,210,${clamp(wet * 1.5, 0, 0.45)})`;
  ctx.beginPath(); ctx.ellipse(it.x, it.y, it.rx, it.ry, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = `rgba(255,255,255,${clamp(wet, 0, 0.35)})`; ctx.lineWidth = 1;
  const rip = (clock / 9 + it.x) % 1;
  ctx.beginPath(); ctx.ellipse(it.x, it.y, it.rx * rip, it.ry * rip, 0, 0, TAU); ctx.stroke();

// ---------- drawing: top-down world (overhead camera) ----------

function drawGround() {
  ctx.fillStyle = rgb(pal.grass); ctx.fillRect(-20, -20, W + 40, H + 40);
  const alt = rgb(pal.grassAlt), off = scrollPos % 120; // mown stripes
  ctx.fillStyle = alt;
  for (let y = -120 + off; y < H; y += 120) { ctx.fillRect(-20, y, ROAD_L + 20, 60); ctx.fillRect(ROAD_R, y, W - ROAD_R + 20, 60); }
  if (grassPat) {
    ctx.save(); ctx.translate(0, scrollPos % 128);
    ctx.fillStyle = grassPat;
    ctx.fillRect(-20, -128, ROAD_L + 20, H + 256); ctx.fillRect(ROAD_R, -128, W - ROAD_R + 20, H + 256);
    ctx.restore();
  }
}

function drawRoad() {
  ctx.fillStyle = rgb(pal.road); ctx.fillRect(ROAD_L, -20, ROAD_W, H + 40);
  if (roadPat) {
    ctx.save(); ctx.translate(0, scrollPos % 128);
    ctx.fillStyle = roadPat; ctx.fillRect(ROAD_L, -128, ROAD_W, H + 256);
    ctx.restore();
  }
  if (wet > 0.03) { // wet-asphalt sheen
    const g = ctx.createLinearGradient(ROAD_L, 0, ROAD_R, H);
    g.addColorStop(0, "rgba(180,200,235,0)"); g.addColorStop(0.5, `rgba(180,200,235,${wet * 0.16})`); g.addColorStop(1, "rgba(180,200,235,0)");
    ctx.fillStyle = g; ctx.fillRect(ROAD_L, 0, ROAD_W, H);
  }
  for (const it of roadItems) drawRoadItem(it);

  const so = scrollPos % 40, edge = 1;
  for (let y = -40 + so; y < H; y += 40) { // rumble strips
    ctx.globalAlpha = edge;
    ctx.fillStyle = "#d62828"; ctx.fillRect(ROAD_L - 6, y, 6, 20); ctx.fillRect(ROAD_R, y, 6, 20);
    ctx.fillStyle = "#f1f1f1"; ctx.fillRect(ROAD_L - 6, y + 20, 6, 20); ctx.fillRect(ROAD_R, y + 20, 6, 20);
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = "#eee";
  ctx.fillRect(ROAD_L, -20, 3, H + 40); ctx.fillRect(ROAD_R - 3, -20, 3, H + 40);
  for (let l = 1; l < LANES; l++) {
    for (let y = -40 + so; y < H; y += 40) ctx.fillRect(ROAD_L + l * LANE_W - 2, y, 4, 22);
  }
}

function drawSpeedLines() {
  const v = state === "playing" ? racers[0].v : 0;
  if (v < 3) return;
  ctx.strokeStyle = `rgba(255,255,255,${clamp((v - 3) / 3, 0, 1) * 0.16})`;
  ctx.lineWidth = 1.5; ctx.beginPath();
  for (let i = 0; i < 18; i++) {
    const x = ROAD_L + 6 + (i * 53) % (ROAD_W - 12), y = (scrollPos * (1.6 + (i % 3) * 0.5) + i * 67) % (H + 120) - 60;
    ctx.moveTo(x, y); ctx.lineTo(x, y + 30 + v * 12);
  }
  ctx.stroke();
}

// ---- the start: chequered line, grid boxes and the five-light gantry ----

function drawTopDown() {

function drawCity(st, hor, px) {

function drawBoard3D(s) {

function drawStand3D(s) {
  const w = 90, rows = 3, rh = 10;
  ctx.fillStyle = "rgba(0,0,0,0.25)"; ell(6, 0, w * 0.6, 5);
  for (let i = 0; i < rows; i++) {
    const wid = w - i * 5, y0 = -i * rh;
    ctx.fillStyle = i % 2 ? "#7c818a" : "#8c919a"; ctx.fillRect(-wid / 2, y0 - rh, wid, rh);
    for (let j = 0; j < 14; j++) {
      const cx = -wid / 2 + 4 + j * (wid - 8) / 13, bob = Math.sin(clock * 0.16 + j * 1.7 + i) * 0.8;
      ctx.fillStyle = s.crowd[i][j]; ell(cx, y0 - rh * 0.4 + bob * 0.5, 2.6, 3.2); ctx.fillStyle = "#f0c8a0"; circle(cx, y0 - rh * 0.8 + bob, 1.5);
    }
  }
  const ty = -rows * rh - 18;
  ctx.fillStyle = "#2a2d34"; ctx.fillRect(-w / 2 - 4, ty, w + 8, 5); ctx.fillStyle = s.roofColor; ctx.fillRect(-w / 2 - 4, ty, w + 8, 2);
  ctx.fillStyle = "#555"; ctx.fillRect(-w / 2, ty + 5, 2.4, rows * rh + 13); ctx.fillRect(w / 2 - 2.4, ty + 5, 2.4, rows * rh + 13);
}

function drawBuilding3D(s) {
  const { bw: w, bh: h } = s, night = pal.dark > 0.08;
  ctx.fillStyle = "rgba(0,0,0,0.25)"; ell(6, 0, w * 0.7, 4);
  ctx.fillStyle = s.bcol; ctx.fillRect(-w / 2, -h, w, h);
  ctx.fillStyle = "rgba(0,0,0,0.18)"; ctx.fillRect(w * 0.15, -h, w * 0.35, h);
  ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fillRect(-w / 2, -h, w, 3);
  for (let wy = -h + 8; wy < -6; wy += 8) for (let wxx = -w / 2 + 4; wxx < w / 2 - 4; wxx += 7) {
    const lit = night && seeded(wy * 3 + wxx * 5 + s.ph) > 0.45;
    ctx.fillStyle = night ? (lit ? "rgba(255,222,140,0.95)" : "rgba(20,24,50,0.6)") : "rgba(190,215,240,0.75)";
    ctx.fillRect(wxx, wy, 4, 4);

}

function drawLamp3D(s) {

const lit = () => clamp(pal.dark * 4, 0, 1); // 0 by day .. ~1 at night
function box(x, y, w, h, col) { // a shaded block standing on y
  ctx.fillStyle = col; ctx.fillRect(x, y - h, w, h);
  ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fillRect(x, y - h, w * 0.3, h);
  ctx.fillStyle = "rgba(0,0,0,0.2)"; ctx.fillRect(x + w * 0.65, y - h, w * 0.35, h);
}
function windows(x, y, w, h, gx, gy, seed) {
  const n = lit();
  for (let j = 0; j < gy; j++) for (let i = 0; i < gx; i++) {
    const on = seeded(seed + i * 7 + j * 13) > 0.45;
    ctx.fillStyle = n > 0.2 ? (on ? "rgba(255,222,140,0.95)" : "rgba(18,22,50,0.7)") : "rgba(170,200,230,0.8)";
    ctx.fillRect(x + (i + 0.25) * w / gx, y - h + (j + 0.25) * h / gy, w / gx * 0.5, h / gy * 0.5);
  }
}
function dome(cx, y, r, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx, y, r, Math.PI, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.22)"; ctx.beginPath(); ctx.arc(cx - r * 0.25, y - r * 0.15, r * 0.6, Math.PI * 1.1, Math.PI * 1.75); ctx.lineTo(cx - r * 0.25, y - r * 0.15); ctx.fill();
}
function spire(cx, y, w, h, col) { ctx.fillStyle = col; poly([[cx - w / 2, y], [cx + w / 2, y], [cx, y - h]]); ctx.fillStyle = "rgba(0,0,0,0.18)"; poly([[cx, y], [cx + w / 2, y], [cx, y - h]]); }
function glow(x, y, r, col, a) {
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); ctx.restore();
}
function arches(x, y, w, h, n, col) {
  ctx.fillStyle = col;
  for (let i = 0; i < n; i++) { const ax = x + (i + 0.5) * w / n, aw = w / n * 0.62; ctx.beginPath(); ctx.moveTo(ax - aw / 2, y); ctx.lineTo(ax - aw / 2, y - h + aw / 2); ctx.arc(ax, y - h + aw / 2, aw / 2, Math.PI, 0); ctx.lineTo(ax + aw / 2, y); ctx.closePath(); ctx.fill(); }
}
function shadowAt(w) { ctx.fillStyle = "rgba(0,0,0,0.25)"; ell(w * 0.1, 0, w * 0.6, Math.max(3, w * 0.07)); }
function water(w, h) {
  const g = ctx.createLinearGradient(0, -h, 0, h); g.addColorStop(0, "#6fb6dc"); g.addColorStop(1, "#2f6f9f");
  ctx.fillStyle = g; ell(0, 0, w, h); ctx.fillStyle = "rgba(255,255,255,0.25)"; ell(-w * 0.3, -h * 0.2, w * 0.3, h * 0.18);
}
function wheel(r, rim, capCol, legCol, n) {
  const cy = -r - 8, rot = clock * 0.004;
  ctx.strokeStyle = legCol; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-r * 0.5, 0); ctx.lineTo(0, cy); ctx.lineTo(r * 0.5, 0); ctx.stroke();
  ctx.strokeStyle = rim; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, cy, r, 0, TAU); ctx.stroke();
  ctx.lineWidth = 0.8; ctx.beginPath(); for (let i = 0; i < n; i++) { const a = i / n * TAU + rot; ctx.moveTo(0, cy); ctx.lineTo(Math.cos(a) * r, cy + Math.sin(a) * r); } ctx.stroke();
  for (let i = 0; i < n; i++) { const a = i / n * TAU + rot; ctx.fillStyle = capCol(i); circle(Math.cos(a) * r, cy + Math.sin(a) * r, 3.4); }
  if (lit() > 0.2) glow(0, cy, r * 1.1, "255,230,160", 0.35 * lit());
}

function drawScenery3D(s) {
  const r = s.r;
  switch (s.kind) {
    case "lm": LMS[s.key](s); break;
    case "prop": PROPS[s.key](s); break;
    case "tree": drawTree3D(s); break;
    case "flag": drawFlag3D(s); break;
    case "board": drawBoard3D(s); break;
    case "stand": drawStand3D(s); break;
    case "building": drawBuilding3D(s); break;
    case "lamp": drawLamp3D(s); break;

      ctx.fillStyle = "rgba(255,255,255,0.14)"; circle(-r * 0.3, -r * 0.9, r * 0.4);

}

function drawSprites3D(C) {
  const list = [];
  for (const s of scenery) { const p = toScreen(C, s.x3, s.y); if (p && p.sc > (s.kind === "lm" ? 0.1 : 0.17) && p.sx > -240 && p.sx < W + 240) list.push({ d: p.d, p, fn: () => drawScenery3D(s) }); } // tiny, far objects aren't worth drawing
  for (const k of pickups) { const p = toScreen(C, k.x, k.y); if (p) list.push({ d: p.d, p, coin: k }); }
  for (const e of enemies) {
    const back = e.y + lenOf(e) / 2; // the end nearest us
    if (e.kind === "works") {
      for (let y = e.y - e.len / 2; y <= back - 70; y += 30) { const p = toScreen(C, e.x, y); if (p) list.push({ d: p.d, p, fn: drawCone3D }); }
      for (let i = 0; i < 4; i++) { const p = toScreen(C, e.x + (e.lane === 0 ? -1 : 1) * (38 - i * 12), back - 10 - i * 18); if (p) list.push({ d: p.d, p, fn: drawCone3D }); }
      const pb = toScreen(C, e.x, back - 4); if (pb) list.push({ d: pb.d, p: pb, fn: drawBarrier3D });
      const ps = toScreen(C, worksSignX(e), back + SIGN_AHEAD); if (ps) list.push({ d: ps.d, p: ps, fn: drawSign3D });
      continue;
    }
    const p = toScreen(C, e.x, back - CAR_H / 2, CAR_H / 2); if (p) list.push({ d: p.d, p, fn: () => drawEnemyRear(e) });
  }
  for (const r of racers) {
    const p = toScreen(C, r.x, r.y, CAR_H / 2);
    if (p) list.push({ d: p.d, p, fn: () => { if (r.ghost > 0 && Math.floor(r.ghost / 5) % 2) ctx.globalAlpha *= 0.35; drawCarRear(r.team, { brake: r.alive && r.braking, slip: r.alive && r.v >= 4.6, nitro: r.alive && r.nitro > 0 }); if (r.shield && r.alive) drawShieldBubble(0, -22, 40, 30); }, tilt: r.tilt, dead: !r.alive });

  if (startObj) { const p = toScreen(C, W / 2, startObj.y); if (p) list.push({ d: p.d, p, fn: () => drawGantry3D() }); }
  if (finishObj) { const p = toScreen(C, W / 2, finishObj.y); if (p) list.push({ d: p.d, p, fn: () => drawGantry3D(true) }); }
  list.sort((a, b) => b.d - a.d);

    if (o.item) { // flat things on the road: leaves and puddles

      ctx.globalAlpha = a;
      if (it.k === "leaf") { ctx.fillStyle = it.c; ctx.beginPath(); ctx.ellipse(p.sx, p.sy, it.s * p.sc, Math.max(0.6, ry * 0.6), it.rot * 0.3, 0, TAU); ctx.fill(); }
      else { ctx.fillStyle = `rgba(140,170,210,${clamp(wet * 1.5, 0, 0.45)})`; ctx.beginPath(); ctx.ellipse(p.sx, p.sy, it.rx * p.sc * 0.8, Math.max(1, ry), 0, 0, TAU); ctx.fill(); }

function drawSpeedStreaks3D(C) {
  const v = state === "playing" ? racers[0].v : 0;
  if (v < 3) return;
  ctx.strokeStyle = `rgba(255,255,255,${clamp((v - 3) / 3, 0, 1) * 0.22})`;
  ctx.lineWidth = 1.5; ctx.beginPath();
  const vx = W / 2 - camOff * 0.2, vy = C.hor;
  for (let i = 0; i < 26; i++) {
    const a = (i * 2.399) % TAU, ph = ((scrollPos * 0.012 * (0.7 + (i % 4) * 0.2) + i * 0.173) % 1), r0 = 40 + ph * ph * 380, r1 = r0 + 14 + ph * 70;

    ctx.moveTo(vx + ca * r0, vy + 30 + sa * r0); ctx.lineTo(vx + ca * r1, vy + 30 + sa * r1);

function drawHaze(C) { // fades the far road into the sky so cars and trees never pop in
  const g = ctx.createLinearGradient(0, C.hor - 8, 0, C.hor + 90);
  const c = mix(pal.sky1, [150, 160, 172], rainI * 0.35);
  g.addColorStop(0, rgb(c, 0.95)); g.addColorStop(1, rgb(c, 0));
  ctx.fillStyle = g; ctx.fillRect(-20, C.hor - 8, W + 40, 100);
}

function draw3D(C) {
  const p0 = racers[0], vib = (state === "playing" ? Math.min(p0.v / VMAX, 1.3) * 0.6 : 0) + nitroFx * 1.8;
  ctx.save();
  ctx.translate(W / 2, H * 0.62);
  ctx.rotate(-(p0.alive ? clamp(p0.tilt, -0.45, 0.45) : 0) * 0.12); // the horizon rolls a touch as you change lanes (never once you've crashed)
  ctx.scale(1.06 + 0.1 * nitroFx, 1.06 + 0.1 * nitroFx);
  ctx.translate(-W / 2 + rnd(-vib, vib), -H * 0.62 + rnd(-vib, vib));
  drawSky(C);
  drawRoad3D(C);
  drawHaze(C);
  drawSpeedStreaks3D(C);
  drawSprites3D(C);
  drawSprayFog(C);
  ctx.restore();
}

  for (const o of racers) if (o !== r && o.alive) { const dd = o.y - r.y; if (dd > -50 && dd < 560) list.push({ dd, x: o.x, L: o.team }); }

}
