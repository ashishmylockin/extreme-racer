<!doctype html><meta charset="utf-8"><base href="../"><title>landmark lab</title>
<style>html,body{margin:0;background:#222;overflow:hidden}</style>
<script type="importmap">{ "imports": { "three": "./lib/three/three.module.min.js", "three/addons/": "./lib/three/addons/" } }</script>
<script type="module">
// A little studio for looking at the city landmarks on their own, under the real sky lighting.
//   tools/landmark-lab.html?k=opera,bridge,sphere&sc=2.6&gap=70&dist=150&el=12&night=1&t=3&w=1200&h=600
//   k = landmark keys laid out in a row `gap` apart, each built like the city builds it (half width 9, scale sc); night=1 lights them up; t = seconds of animation
import * as THREE from "three";
import { loadSkies, skyOf } from "./js/render3d/env.js";
import { makeLandmark, glows, tickLandmarks } from "./js/render3d/landmarks.js";
const q = new URLSearchParams(location.search), W = +q.get("w") || innerWidth, H = +q.get("h") || innerHeight, night = +q.get("night") || 0;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.setSize(W, H); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
await loadSkies(renderer); const sky = skyOf(night ? "night" : "midday");
const scene = new THREE.Scene(); scene.environment = sky.env; scene.background = new THREE.Color(night ? 0x060a18 : 0x8fb4d8); scene.environmentIntensity = night ? 0.3 : 0.6;
const sun = new THREE.DirectionalLight(night ? 0x9fb4ff : 0xfff0d6, night ? 0.3 : 4.5); sun.position.set(-120, 160, 90); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); Object.assign(sun.shadow.camera, { left: -400, right: 400, top: 300, bottom: -300, far: 1200 }); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x77806a, roughness: 1 })); ground.receiveShadow = true; scene.add(ground);
const road = new THREE.Mesh(new THREE.PlaneGeometry(3000, 32).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x3a3c42, roughness: 0.9 })); road.position.set(0, 0.02, 60); road.receiveShadow = true; scene.add(road);
const keys = (q.get("k") || "opera").split(","), sc = +q.get("sc") || 2.6, gap = +q.get("gap") || 70;
keys.forEach((k, i) => { const o = makeLandmark(k, 9); o.scale.setScalar(sc); o.position.x = (i - (keys.length - 1) / 2) * gap; o.rotation.y = +q.get("ry") || 0; o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); scene.add(o); });
for (const g of glows) g.mat.emissiveIntensity = g.base * (g.nightOnly ? night : 0.12 + 0.8 * night);
const az = (+q.get("az") || 0) * Math.PI / 180, el = (+q.get("el") || 12) * Math.PI / 180, dist = +q.get("dist") || 150, ty = +q.get("ty") || 20;
const cam = new THREE.PerspectiveCamera(+q.get("fov") || 45, W / H, 0.5, 3000); cam.position.set(Math.sin(az) * Math.cos(el) * dist, Math.sin(el) * dist + 2, Math.cos(az) * Math.cos(el) * dist); cam.lookAt(0, ty, 0);
if (tickLandmarks) tickLandmarks(+q.get("t") || 0, night);
renderer.render(scene, cam); renderer.render(scene, cam);
document.title = "ready";
</script>
