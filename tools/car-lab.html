<!doctype html><meta charset="utf-8"><base href="../"><title>vehicle lab</title>
<style>html,body{margin:0;background:#222;overflow:hidden}</style>
<script type="importmap">{ "imports": { "three": "./lib/three/three.module.min.js", "three/addons/": "./lib/three/addons/" } }</script>
<script src="js/data/teams.js"></script>
<script type="module">
// A little studio for looking at the vehicles on their own, under the real sky lighting.
//   tools/car-lab.html?v=sedan:#c0392b,hatch:#2f5fa8&az=35&el=14&dist=14&w=1000&h=560
//   v = a list of  kind:colour  (kinds: the car types, truck-box, truck-container, truck-tanker, bus, race:N)  laid out in a row 12 apart
import * as THREE from "three";
import { loadSkies, skyOf } from "./js/render3d/env.js";
import * as T from "./js/render3d/car/traffic.js";
import { makeProRaceCar } from "./js/render3d/car/racecar.js";
const q = new URLSearchParams(location.search), W = +q.get("w") || innerWidth, H = +q.get("h") || innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.setSize(W, H); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
await loadSkies(renderer); const sky = skyOf(q.get("sky") || "midday");
const scene = new THREE.Scene(); scene.environment = sky.env; scene.background = new THREE.Color(0x8fb4d8); scene.environmentIntensity = 0.9;
const sun = new THREE.DirectionalLight(0xfff0dd, 2.4); sun.position.set(-30, 50, 20); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40 }); scene.add(sun);
const road = new THREE.Mesh(new THREE.PlaneGeometry(400, 400).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x55575c, roughness: 0.85 })); road.receiveShadow = true; scene.add(road);
const list = (q.get("v") || "sedan:#c0392b").split(","), night = +q.get("night") || 0; T.trafficLamp.color.setScalar(0.8 + 3.2 * night); if (night) { sun.intensity = 0.2; scene.environmentIntensity = 0.25; }
const spacing = +q.get("gap") || 12;
list.forEach((s, i) => {
  const [kind, c] = s.split(":"); let o;
  if (kind === "race") o = makeProRaceCar(TEAMS[+c || 0]);
  else if (T.makeTruck && kind.startsWith("truck")) o = T.makeTruck(160 * 0.1, c || "#f2f2f0", kind.split("-")[1] || "box");
  else if (kind === "bus" && T.makeBus) o = T.makeBus(c || "#c0392b");
  else o = T.makeCar(kind, c || "#c0392b");
  o.position.x = (i - (list.length - 1) / 2) * spacing; o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); scene.add(o);
});
const az = (+q.get("az") || 30) * Math.PI / 180, el = (+q.get("el") || 14) * Math.PI / 180, dist = +q.get("dist") || 16, tx = +q.get("tx") || 0;
const cam = new THREE.PerspectiveCamera(+q.get("fov") || 38, W / H, 0.1, 500); cam.position.set(tx + Math.sin(az) * Math.cos(el) * dist, Math.sin(el) * dist + 1, Math.cos(az) * Math.cos(el) * dist); cam.lookAt(tx, 1.3, 0);
renderer.render(scene, cam); renderer.render(scene, cam);
document.title = "ready";
</script>
